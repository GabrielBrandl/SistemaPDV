services:
  postgres:
    image: postgres:16-alpine
    container_name: pdv-postgres
    environment:
      POSTGRES_USER: pdv
      POSTGRES_PASSWORD: pdv_secret
      POSTGRES_DB: pdv_cashless
    ports:
      - "5432:5432"
    volumes:
      - pdv_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pdv-redis
    ports:
      - "6379:6379"

volumes:
  pdv_pg_data:

# Produção — EasyPanel / Docker
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_TYPE: postgres
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL: ${DB_SSL:-false}
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      PORT: 3000
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      PIX_PROVIDER: ${PIX_PROVIDER:-demo}
      SOFTPOS_PROVIDER: ${SOFTPOS_PROVIDER:-demo}
      FOCUS_NFE_AMBIENTE: ${FOCUS_NFE_AMBIENTE:-homologacao}
      EMPRESA_CNPJ: ${EMPRESA_CNPJ:-}
      EMPRESA_RAZAO: ${EMPRESA_RAZAO:-}
      EMPRESA_UF_CODIGO: ${EMPRESA_UF_CODIGO:-13}
      NFCE_SERIE: ${NFCE_SERIE:-1}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build: ./web-admin
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

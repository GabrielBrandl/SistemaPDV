# Produção — EasyPanel Compose (apps-pyrou / sistema-pdv)
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_TYPE: ${DB_TYPE:-postgres}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL: ${DB_SSL:-false}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      PORT: "3000"
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      PIX_PROVIDER: ${PIX_PROVIDER:-demo}
      SOFTPOS_PROVIDER: ${SOFTPOS_PROVIDER:-demo}
      FOCUS_NFE_AMBIENTE: ${FOCUS_NFE_AMBIENTE:-homologacao}
      EMPRESA_CNPJ: ${EMPRESA_CNPJ:-}
      EMPRESA_RAZAO: ${EMPRESA_RAZAO:-}
      EMPRESA_UF_CODIGO: ${EMPRESA_UF_CODIGO:-13}
      NFCE_SERIE: ${NFCE_SERIE:-1}
    expose:
      - "3000"

  web:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

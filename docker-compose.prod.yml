# Produção — EasyPanel Compose (sistema-pdv / app)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pdv}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pdv_secret}
      POSTGRES_DB: ${DB_NAME:-pdv_nfc}
    volumes:
      - pdv_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pdv} -d ${DB_NAME:-pdv_nfc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: ${DB_TYPE:-postgres}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-pdv}
      DB_PASSWORD: ${DB_PASSWORD:-pdv_secret}
      DB_NAME: ${DB_NAME:-pdv_nfc}
      DB_SSL: ${DB_SSL:-false}
      DATABASE_URL: postgresql://${DB_USER:-pdv}:${DB_PASSWORD:-pdv_secret}@postgres:5432/${DB_NAME:-pdv_nfc}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      PORT: "3000"
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      PIX_PROVIDER: ${PIX_PROVIDER:-demo}
      SOFTPOS_PROVIDER: ${SOFTPOS_PROVIDER:-demo}
      CIELO_CLIENT_ID: ${CIELO_CLIENT_ID:-}
      CIELO_ACCESS_TOKEN: ${CIELO_ACCESS_TOKEN:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_PUBLIC_KEY: ${MERCADOPAGO_PUBLIC_KEY:-}
      MERCADOPAGO_TERMINAL_ID: ${MERCADOPAGO_TERMINAL_ID:-}
      FOCUS_NFE_AMBIENTE: ${FOCUS_NFE_AMBIENTE:-homologacao}
      EMPRESA_CNPJ: ${EMPRESA_CNPJ:-}
      EMPRESA_RAZAO: ${EMPRESA_RAZAO:-}
      EMPRESA_UF_CODIGO: ${EMPRESA_UF_CODIGO:-13}
      NFCE_SERIE: ${NFCE_SERIE:-1}
    expose:
      - "3000"

  web:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

volumes:
  pdv_pgdata:
